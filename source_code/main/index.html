<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thermal Monocular · Settings</title>
  <style>
    :root {
      --text_color: #e8e6e3;
      --text_muted: #9ca3af;
      --bg_dark: #0d0f12;
      --bg_card: #161a1f;
      --bg_input: #1e2329;
      --accent_warm: #e85d2e;
      --accent_cool: #2dd4e8;
      --border: #2a2e35;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg_dark);
      color: var(--text_color);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      min-height: 100vh;
    }

    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 12px 24px;
    }

    header {
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text_muted);
      margin: 4px 0 0;
    }

    .hint {
      grid-column: 1 / -1;
      margin: -4px 0 2px;
      color: var(--text_muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .range-control {
      display: grid !important;
      grid-template-columns: 1fr 3rem;
      gap: 10px;
      width: min(220px, 52vw);
    }

    output {
      color: var(--accent_cool);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    #status {
      min-height: 1.2rem;
      margin: 12px 4px 0;
      color: var(--text_muted);
      font-size: 0.78rem;
    }

    #status.error { color: #fb7185; }

    .diagnostics {
      margin: 12px 4px 0;
      color: var(--text_muted);
      font-size: 0.72rem;
    }

    #diagnostic_log {
      max-height: 7rem;
      overflow-y: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .section-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text_muted);
      margin: 20px 0 8px;
      padding: 0 4px;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
    }

    .main > div {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 10px 14px;
      margin: 4px 0;
      background: var(--bg_card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .main > div > label:first-child {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .main > div > div {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    select {
      font-size: 1rem;
      color: var(--text_color);
      background-color: var(--bg_input);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      min-width: 140px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--accent_warm);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--border);
      transition: 0.25s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.25s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent_warm);
    }

    input:focus + .slider {
      box-shadow: 0 0 0 2px var(--bg_dark), 0 0 0 4px var(--accent_warm);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    button {
      font-size: 1rem;
      color: var(--text_color);
      background-color: var(--bg_input);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
    }

    button:focus {
      outline: none;
      border-color: var(--accent_warm);
    }

    input[type="range"] {
      width: 100%;
      max-width: 200px;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--border);
      border-radius: 4px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent_warm);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent_warm);
      cursor: pointer;
      border: none;
    }

    .zoom_slider {
      width: 100%;
      max-width: 200px;
    }

    #zoom_div > div {
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Thermal Monocular</h1>
      <p>Settings</p>
    </header>

    <p class="section-title">Image</p>
    <div class="main">
      <div id="preset_div">
        <label>Preset</label>
        <div>
          <select onchange="updateValue(this.id, this.value)" id="active_profile"></select>
        </div>
      </div>
      <div id="preset_en_div">
        <label>Preset Active</label>
        <div>
          <label class="switch">
            <input id="preset_en" onchange="updateValue(this.id, this.checked ? 1 : 0)" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <!--
      <div id="color_div">
        <label>Color Palette</label>
        <div>
          <select onchange="updateValue(this.id, this.value)" id="pseudo_color">
            <option value="0">WHOT</option>
            <option value="10">BHOT</option>
          </select>
        </div>
      </div>
      -->
      <div id="scene_div">
        <label>Scene Mode</label>
        <div>
          <select onchange="updateValue(this.id, this.value)" id="scene_mode">
            <option value="0">LowHighlight</option>
            <option value="1">LinearStretch</option>
            <option value="2">LowContrast</option>
            <option value="3" selected>GeneralMode</option>
            <option value="4">HighContrast</option>
            <option value="5">Highlight</option>
            <option value="9">Outline</option>
          </select>
        </div>
      </div>
      <div id="edges_div">
        <label>Edges</label>
        <div>
          <input type="range" id="edge_enhancment_gear" min="0" max="2" value="0" oninput="updateValue(this.id, this.value)">
        </div>
      </div>
      <div id="contrast_div">
        <label>Contrast</label>
        <div>
          <input type="range" id="contrast" min="0" max="100" value="0" oninput="updateValue(this.id, this.value)">
        </div>
      </div>
      <div id="detail_div">
        <label>Detail</label>
        <div>
          <input type="range" id="detail_enhancement_gear" min="0" max="100" value="0" oninput="updateValue(this.id, this.value)">
        </div>
      </div>
      <!--
      <div id="fix_div">
        <label>Fixes</label>
        <div>
          <button onclick="updateValue('save_video', 1)">Video</button>
          <button onclick="updateValue('resend', 1)">Resend</button>
        </div>
      </div>
      -->
    </div>

    <!--
    <p class="section-title">Camera</p>
    <div class="main">
      <div id="burnprotection_div">
        <label>Burn Protection</label>
        <div>
          <label class="switch">
            <input id="burn_protection_en" onchange="updateValue(this.id, this.checked ? 1 : 0)" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <div id="autoshutter_div">
        <label>Auto Shutter</label>
        <div>
          <label class="switch">
            <input id="auto_shutter_en" onchange="updateValue(this.id, this.checked ? 1 : 0)" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
    -->

    <p class="section-title">Alignment</p>
    <div class="main">
      <div id="flip_div">
        <label>Flip Mode</label>
        <div>
          <select onchange="updateValue(this.id, this.value)" id="flip_mode">
            <option value="0">No-Flip</option>
            <option value="1">X-Flip</option>
            <option value="2">Y-Flip</option>
            <option value="3">XY-Flip</option>
          </select>
        </div>
      </div>
      <div id="av_format_div">
        <label>Video format</label>
        <div>
          <select onchange="updateValue(this.id, this.value)" id="av_format">
            <option value="0">NTSC</option>
            <option value="1" selected>PAL</option>
          </select>
        </div>
      </div>
      <!--
      <div id="refresh_flip_mode_div">
        <label>Periodically Refresh</label>
        <div>
          <label class="switch">
            <input id="refresh_flip_mode" onchange="updateValue(this.id, this.checked ? 1 : 0)" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
      </div>
      -->
    </div>

    <p class="section-title">Crosshair</p>
    <div class="main">
      <div>
        <label for="crosshair_enabled">Enabled</label>
        <div>
          <label class="switch">
            <input id="crosshair_enabled" onchange="updateValue(this.id, this.checked ? 1 : 0)" type="checkbox">
            <span class="slider"></span>
          </label>
        </div>
        <p class="hint">Aim adjustment shifts the thermal image beneath the camera's fixed crosshair. Increase zoom to create adjustment room.</p>
      </div>
      <div id="zoom_div" class="aim-control">
        <label for="zoom">Zoom</label>
        <div class="range-control">
          <input class="zoom_slider" type="range" id="zoom" min="10" max="15" value="10" oninput="showRangeValue(this)" onchange="updateZoom()">
          <output id="zoom_value">1.0×</output>
        </div>
      </div>
      <div class="aim-control">
        <label for="zoom_x">Horizontal</label>
        <div class="range-control">
          <input class="zoom_slider" type="range" id="zoom_x" min="0" max="255" value="128" oninput="showRangeValue(this)" onchange="updateZoom()">
          <output id="zoom_x_value">128</output>
        </div>
      </div>
      <div class="aim-control">
        <label for="zoom_y">Vertical</label>
        <div class="range-control">
          <input class="zoom_slider" type="range" id="zoom_y" min="0" max="191" value="96" oninput="showRangeValue(this)" onchange="updateZoom()">
          <output id="zoom_y_value">96</output>
        </div>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <footer class="diagnostics">
      <div>Firmware <span id="firmware_version">unknown</span></div>
      <div id="diagnostic_log" role="log" aria-live="polite"></div>
    </footer>
  </div>

  <script>
    let sensor_width = 256;
    let sensor_height = 192;
    const diagnosticEntries = [];

    function logDiagnostic(message) {
      diagnosticEntries.push(`${new Date().toLocaleTimeString()} ${message}`);
      if (diagnosticEntries.length > 20) diagnosticEntries.shift();
      document.getElementById("diagnostic_log").textContent = diagnosticEntries.join("\n");
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.classList.toggle("error", isError);
    }

    function showRangeValue(input) {
      const output = document.getElementById(`${input.id}_value`);
      if (output === null) return;
      output.textContent = input.id === "zoom"
        ? `${(parseInt(input.value, 10) / 10).toFixed(1)}×`
        : input.value;
    }

    function setAimControlsVisible(visible) {
      document.querySelectorAll(".aim-control").forEach(element => {
        element.style.display = visible ? "grid" : "none";
      });
    }

    function updateZoomLimits() {
      const zoom = document.getElementById("zoom");
      const zoom_x = document.getElementById("zoom_x");
      const zoom_y = document.getElementById("zoom_y");

      const x_room = Math.ceil((sensor_width - (sensor_width / (parseInt(zoom.value, 10) / 10))) / 2);
      const y_room = Math.ceil((sensor_height - (sensor_height / (parseInt(zoom.value, 10) / 10))) / 2);
      zoom_x.min = (sensor_width / 2) - x_room;
      zoom_x.max = (sensor_width / 2) + x_room;
      zoom_y.min = (sensor_height / 2) - y_room;
      zoom_y.max = (sensor_height / 2) + y_room;
      zoom_x.value = Math.min(Number(zoom_x.max), Math.max(Number(zoom_x.min), Number(zoom_x.value)));
      zoom_y.value = Math.min(Number(zoom_y.max), Math.max(Number(zoom_y.min), Number(zoom_y.value)));
      const aimEnabled = parseInt(zoom.value, 10) > 10;
      zoom_x.disabled = !aimEnabled;
      zoom_y.disabled = !aimEnabled;
      showRangeValue(zoom);
      showRangeValue(zoom_x);
      showRangeValue(zoom_y);
    }

    function updateZoom() {
      updateZoomLimits();

      const zoom = parseInt(document.getElementById("zoom").value, 10);
      const zoom_x = parseInt(document.getElementById("zoom_x").value, 10);
      const zoom_y = parseInt(document.getElementById("zoom_y").value, 10);
      setStatus("Saving…");
      logDiagnostic(`SET zoom=${zoom} x=${zoom_x} y=${zoom_y}`);
      fetch("/set", {
        method: "POST",
        body: JSON.stringify({ zoom: {
          zoom: zoom,
          x: zoom_x,
          y: zoom_y
        }})
      }).then(response => {
        if (!response.ok) throw new Error(`Device rejected the setting (${response.status})`);
        logDiagnostic("SET zoom accepted");
        return sync_data();
      }).then(() => setStatus("Saved on device"))
        .catch(error => {
          logDiagnostic(`ERROR ${error.message}`);
          setStatus(error.message, true);
          return sync_data().catch(() => {});
        });
    }

    function updateValue(key, value) {
      if (key === "flip_mode") {
        setAimControlsVisible(value === "0");
      }
      const parsedValue = parseInt(value, 10);
      setStatus("Saving…");
      logDiagnostic(`SET ${key}=${parsedValue}`);
      return fetch("/set", {
        method: "POST",
        body: JSON.stringify({ [key]: parsedValue })
      }).then(response => {
        if (!response.ok) throw new Error(`Device rejected the setting (${response.status})`);
        logDiagnostic(`SET ${key} accepted`);
        return sync_data();
      }).then(() => setStatus("Saved on device"))
        .catch(error => {
          logDiagnostic(`ERROR ${error.message}`);
          setStatus(error.message, true);
          return sync_data();
        });
    }

    function updateRemoteValue(key, source) {
      updateValue(key, document.getElementById(source).value);
    }

    function sync_data() {
      logDiagnostic("GET initial/state sync");
      return fetch('/get')
      .then(response => {
        if (!response.ok) throw new Error(`Unable to read device state (${response.status})`);
        return response.json();
      })
      .then(data => {
        console.log("Syncing data:", data);
        document.getElementById("firmware_version").textContent = data.firmware_version || "unknown";
        if (Object.prototype.hasOwnProperty.call(data, "boot_analog_video_ok")) {
          logDiagnostic(data.boot_analog_video_ok
            ? "BOOT analog video initialized"
            : `BOOT analog video failed (${data.boot_analog_video_status})`);
        }
        for (const key in data) {
          if (key === "firmware_version" || key === "boot_analog_video_ok" || key === "boot_analog_video_status") {
            continue;
          } else if (key === "sensor_width") {
            sensor_width = data[key];
          } else if (key === "sensor_height") {
            sensor_height = data[key];
          } else if (key === "zoom_x") {
            document.getElementById("zoom_x").value = data[key];
          } else if (key === "zoom_y") {
            document.getElementById("zoom_y").value = data[key];
          } else if (key === "zoom") {
            document.getElementById("zoom").value = data[key];
          } else if (key === "auto_shutter_en" || key === "burn_protection_en" || key === "preset_en" || key === "refresh_flip_mode" || key === "crosshair_enabled") {
            const checkbox = document.getElementById(key);
            if (checkbox !== null) {
              checkbox.checked = data[key];
            }
          } else if (key === "preset_count") {
            const select = document.getElementById("active_profile");
            if (select.options.length === 0) {
              select.innerHTML = "";
              for (let i = 0; i < data[key]; i++) {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = `Preset ${i}`;
                select.appendChild(option);
              }
            }
          } else if (key === "active_profile") {
              const select = document.getElementById("active_profile");
              select.value = data[key];
          } else {
            if (key === "flip_mode") {
              setAimControlsVisible(data[key] === 0);
            }

            const element = document.getElementById(key);
            if (element === null) {
              console.log("Cant find " + key);
              continue;
            }
            element.value = data[key];
            if (element.type === "range") showRangeValue(element);
          }
        }
        updateZoomLimits();
      })
      .catch(error => {
        logDiagnostic(`ERROR ${error.message}`);
        setStatus(error.message, true);
        throw error;
      });
    }

    sync_data().catch(() => {});
  </script>
</body>
</html>
